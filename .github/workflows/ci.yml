name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: delegatelab-frontend
      - uses: actions/checkout@v4
        with:
          repository: delegatelab/delegatelab-engine
          ref: main
          path: delegatelab-engine
      - uses: actions/checkout@v4
        with:
          repository: delegatelab/delegatelab-backend
          ref: main
          path: delegatelab-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: delegatelab-frontend
